name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build web
        run: cd web && npm install --no-audit --no-fund && npm run build
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o sadp-hub .
